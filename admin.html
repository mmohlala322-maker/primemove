<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeMove Admin</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f2f6;padding:12px;padding-bottom:90px}
.top{max-width:560px;margin:0 auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
h2{margin:0 0 8px 0}
input,select{width:100%;padding:14px;border-radius:12px;border:2px solid #e5e7eb;margin-top:10px;font-size:15px;box-sizing:border-box}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:12px;font-size:15px;cursor:pointer}
.b-dark{background:#111;color:#fff}
.b-yellow{background:#facc15;color:#111}
.b-green{background:#16a34a;color:#fff}
.item{background:#fffbeb;border-left:6px solid #facc15;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.item b{font-size:15px}
.small{font-size:12px;color:#666;margin-top:4px;word-break:break-all}
.actions{display:flex;gap:8px;margin-top:10px}
.a-del{background:#ef4444;color:#fff;padding:8px 14px;border-radius:999px;border:none;font-weight:700;font-size:13px}
.a-share{background:#111;color:#fff;padding:8px 14px;border-radius:999px;border:none;font-weight:700;font-size:13px}
.linkBox{background:#111;color:#0f0;padding:12px;border-radius:12px;margin-top:14px;font-size:12px;word-break:break-all;display:none}
</style>
</head>
<body>
<div class="top">
<h2>🚚 PrimeMove Admin</h2>
<div class="small">Your current admin — now with private tracking links</div>

<div id="plCode" style="text-align:center;font-weight:900;font-size:26px;background:#facc15;padding:14px;border-radius:14px;margin-top:12px">PL------</div>

<input id="custName" placeholder="Customer Name - e.g. Lebo Mohlala">
<input id="custPhone" placeholder="Phone - e.g. 0834936558">
<input id="custAddr" placeholder="Address - e.g. 7704 Motanyane Street">
<input id="custArea" placeholder="Fee - e.g. R0 + R0 | SPHUMELELE1" value="R0 + R0 | SPHUMELELE1">
<select id="custStatus">
<option>Picked Up</option>
<option selected>Assigned</option>
<option>Out for Delivery</option>
<option>Delivered</option>
</select>

<button class="btn b-dark" onclick="generate()">✨ GENERATE NEW PL</button>
<button class="btn b-dark" onclick="saveParcel()">💾 SAVE PARCEL</button>

<div id="privateBox" class="linkBox"></div>
