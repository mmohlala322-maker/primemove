<button onclick="sendToDriver()" style="width:100%;padding:12px;margin-top:10px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:14px;">📤 SEND TO DRIVER - SYNC ORDERS</button>
<script>
function sendToDriver(){
  let orders=JSON.parse(localStorage.getItem("pm_final")||"[]");
  if(orders.length==0){alert("No orders on this phone!");return;}
  let code=prompt("Driver code?","PM1001")||"PM1001";
  let b64=btoa(encodeURIComponent(JSON.stringify(orders)));
  let link="https://mmohlala322-maker.github.io/primemove/driver.html?driver="+code+"&sync="+b64;
  if(confirm("Send "+orders.length+" parcels to "+code+"?")){
    window.open("https://wa.me/?text="+encodeURIComponent("🚚 Click for your parcels: "+link),"_blank");
  }else{
    prompt("Copy link:",link);
  }
}
</script>
