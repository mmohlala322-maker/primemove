<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PrimeMove</title><style>body{font-family:Arial;background:#f8fafc;margin:0} .h{background:#111;color:#fff;padding:20px;text-align:center} .s{background:#fff;margin:-15px 12px 12px;padding:16px;border-radius:14px} input,button{width:100%;padding:14px;border-radius:10px;margin-top:10px;box-sizing:border-box} input{border:2px solid #e2e8f0} button{border:none;font-weight:bold} .black{background:#111;color:#fff} .card{background:#fff;margin:12px;padding:20px;border-radius:14px}</style></head><body><div class=h><h1 style=margin:0>PrimeMove 🚚</h1></div><div class=s><input id=trackInput placeholder="PL262857"><button onclick=doTrack() class=black>TRACE</button></div><div id=result></div><script>let orders=[{id:"PL262857",orderId:"PL262857",customerName:"Customer",deliveryAddress:"Durban, KZN",driverCode:"PM-DRV-01",driverName:"PrimeMove Driver",driverPhone:"0810000000",status:"In Warehouse"}];function doTrack(){let c=document.getElementById("trackInput").value.trim().toUpperCase();let b=document.getElementById("result");if(!c){b.innerHTML="<div class=card>Enter code</div>";return}let f=orders.find(o=>o.id===c);if(!f){b.innerHTML="<div class=card>Not found</div>";return}b.innerHTML=`<div class=card><div style=font-size:24px;font-weight:bold>${f.id}</div><div style=margin:12px 0;padding:14px;background:#fef3c7;color:#92400e;border-radius:10px;font-weight:bold;text-align:center;font-size:18px>🏭 ${f.status.toUpperCase()}<div style=font-size:12px;font-weight:normal;margin-top:4px>📍 Currently in Warehouse - Ready for dispatch</div></div><div>👤 ${f.driverName}<br>📞 ${f.driverPhone}<br>📍 ${f.deliveryAddress}</div><div style=display:flex;gap:8px;margin-top:12px><a href="tel:${f.driverPhone}" style=flex:1;background:#111;color:#fff;padding:14px;border-radius:8px;text-align:center;text-decoration:none>CALL</a><a href="https://wa.me/27${f.driverPhone.substring(1)}" style=flex:1;background:#25D366;color:#fff;padding:14px;border-radius:8px;text-align:center;text-decoration:none>WhatsApp</a></div></div>`}let u=new URL(location.href);let t=u.searchParams.get("track");if(t){document.getElementById("trackInput").value=t;setTimeout(()=>doTrack(),500)}</script></body></html>
