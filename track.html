<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PrimeMove</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial;background:#f2f4f8}
.header{background:#111;color:#fff;padding:22px;text-align:center}.wrap{max-width:480px;margin:0 auto;padding:0 14px 30px}
.searchCard{background:#fff;margin-top:-14px;padding:18px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.searchCard input{width:100%;padding:16px;border-radius:14px;border:2px solid #e5e7eb;font-size:16px}
.searchCard button{width:100%;padding:16px;border-radius:14px;border:none;background:#111;color:#fff;font-weight:800;margin-top:12px}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:20px;margin-top:16px}
.label{font-size:11px;color:#9aa0a6;font-weight:700;text-transform:uppercase}.pid{font-size:32px;font-weight:900}.badge{background:#facc15;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}
.custName{font-size:22px;font-weight:800;margin-top:8px}.addr{color:#6b7280;margin-top:10px}
.avatar{width:58px;height:58px;border-radius:999px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.btnRow{display:flex;gap:12px;margin-top:16px}.btnCall{flex:1;background:#111;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:800}.btnWa{flex:1;background:#22c55e;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:800}
.tRow{display:flex;gap:14px;margin-top:18px}.dot{width:20px;height:20px;border-radius:999px}.dotFull{background:#facc15}.dotRing{border:2px solid #facc15;background:#fff}.dotGray{border:2px solid #d1d5db;background:#fff}
.line{width:2px;height:22px;margin-left:9px;background:#e5e7eb}.small{color:#6b7280;font-size:12px}</style></head><body>
<div class=header><b>Parcel Tracking</b><br><small>🚚 PrimeMove</small></div>
<div class=wrap><div class=searchCard><input id=q placeholder="PL code"><button onclick="track()">TRACK PARCEL</button></div><div id=out></div></div>
<script>
let CLOUD_ORDERS=[];
async function loadCloud(){
 try{
  let r=await fetch('./orders.json?v='+Date.now());
  let j=await r.json();
  CLOUD_ORDERS=j;
  console.log('Cloud orders loaded', j);
 }catch(e){console.log('Cloud load fail', e)}
}
function getAll(){
 let all=[...CLOUD_ORDERS];
 // also scan localStorage for admin added on same phone
 for(let i=0;i<localStorage.length;i++){
  try{let v=localStorage.getItem(localStorage.key(i)); if(v&&v.includes('PL')){let j=JSON.parse(v); let arr=Array.isArray(j)?j:[j]; arr.forEach(o=>{let id=(o.id||o.parcelId||'').toString().toUpperCase(); if(id.startsWith('PL')) all.push({id, customer:o.customerName||o.customer, addr:o.address||o.addr, driver:o.driverName||o.driver, dphone:o.driverPhone||o.dphone, code:o.driverCode, status:o.status})})}}catch(e){}
 }
 let map={}; all.forEach(o=>{if(o.id) map[o.id.toUpperCase()]=o}); return Object.values(map);
}
async function track(){
 await loadCloud();
 let v=document.getElementById('q').value.trim().toUpperCase();
 if(!v){document.getElementById('out').innerHTML='<div class=card>❌ Enter PL code</div>';return}
 let all=getAll(); let o=all.find(x=>x.id.toUpperCase()===v);
 if(!o){document.getElementById('out').innerHTML=`<div class=card>❌ ${v} not found<br><small>Cloud has: ${all.map(a=>a.id).join(', ')}</small></div>`;return}
 let initials=o.driver.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
 document.getElementById('out').innerHTML=`
  <div class=card><div class=label>Parcel ID</div><div style="display:flex;justify-content:space-between"><div class=pid>${o.id}</div><div class=badge>${o.status}</div></div></div>
  <div class=card><div class=label>Customer</div><div class=custName>${o.customer}</div><div class=addr>📍 ${o.addr}</div></div>
  <div class=card><div class=label>Driver</div><div style="display:flex;gap:14px;margin-top:14px"><div class=avatar>${initials}</div><div><div style="font-weight:800">${o.driver}</div><div style="color:#6b7280">📞 ${o.dphone}</div></div></div><div class=label style="margin-top:16px">Driver Code</div><div style="font-weight:800">${o.code}</div><div class=btnRow><a href="tel:${o.dphone}" style="flex:1"><button class=btnCall>📞 CALL</button></a><a href="https://wa.me/27${o.dphone.slice(-9)}" target="_blank" style="flex:1"><button class=btnWa>WhatsApp</button></a></div></div>
  <div class=card><div class=label>Tracking Status</div><div class=tRow><div class="dot dotFull"></div><div><b>Parcel Assigned</b><div class=small>${o.status}</div></div></div></div>`;
}
loadCloud();
let p=new URL(location.href).searchParams.get('track'); if(p){document.getElementById('q').value=p; setTimeout(track,800)}
</script></body></html>
