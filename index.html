<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeMove - Track</title>
<style>
body{font-family:Arial;background:#f8fafc;margin:0}
.h{background:#111;color:#fff;padding:20px;text-align:center}
.s{background:#fff;margin:-15px 12px 12px;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,button{width:100%;padding:14px;border-radius:10px;margin-top:10px;box-sizing:border-box;font-size:15px}
input{border:2px solid #e2e8f0}
button{border:none;font-weight:bold;cursor:pointer}
.black{background:#111;color:#fff}
.card{background:#fff;margin:12px;padding:18px;border-radius:14px;box-shadow:0 2px 8px #0001}
.statusBox{margin:14px 0;padding:14px;border-radius:12px;text-align:center;font-weight:bold;font-size:15px;border:2px solid}
.timeline{display:flex;justify-content:space-between;margin:16px 0}
.step{text-align:center;flex:1;opacity:0.3}
.step.active{opacity:1}
.dot{width:32px;height:32px;border-radius:50%;background:#e2e8f0;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.step.active .dot{background:#111;color:#fff}
</style>
</head>
<body>
<div class=h>
<h1 style=margin:0>PrimeMove 🚚</h1>
<div style=font-size:13px;margin-top:4px;opacity:0.8>Track Your Parcel</div>
</div>
<div class=s>
<input id=trackInput placeholder="Enter PL code e.g. PL262857">
<button onclick=doTrack() class=black>🔍 TRACK MY PARCEL</button>
</div>
<div id=result></div>

<script>
let orders=[];
try{
let r=localStorage.getItem("pm_final");
if(r) orders=JSON.parse(r);
}catch(e){}

(function(){
try{
let u=new URL(location.href);
let s=u.searchParams.get("sync");
let t=u.searchParams.get("track");
if(s){
let j=decodeURIComponent(atob(s));
j=decodeURIComponent(j);
let inc=JSON.parse(j);
if(!Array.isArray(inc)) inc=[inc];
// UPDATE LOGIC - If exists, UPDATE status, if not, ADD
inc.forEach(ni=>{
let id=ni.id||ni.orderId;
let idx=orders.findIndex(o=>(o.id||o.orderId)==id);
if(idx>=0){
// UPDATE existing - merge new data to keep status fresh
orders[idx]={...orders[idx],...ni};
}else{
orders.unshift(ni);
}
});
localStorage.setItem("pm_final",JSON.stringify(orders));
if(t){
document.getElementById("trackInput").value=t;
setTimeout(()=>doTrackCode(t),600);
return;
}
}
if(t){
document.getElementById("trackInput").value=t;
setTimeout(()=>doTrackCode(t),400);
}
}catch(e){console.log(e)}
})();

function normalize(o){
return{
id:o.id||o.orderId,
customerName:o.customerName||"",
customerPhone:o.customerPhone||"",
deliveryAddress:o.deliveryAddress||"",
amount:o.amount||"0",
deliveryFee:o.deliveryFee||"0",
driverCode:o.driverCode||"",
driverName:o.driverName||o.driverCode,
driverPhone:o.driverPhone||"",
status:o.status||"In Warehouse",
createdAt:o.createdAt||new Date().toISOString()
};
}

function doTrack(){
let c=document.getElementById("trackInput").value.trim().toUpperCase();
doTrackCode(c);
}

function doTrackCode(code){
let b=document.getElementById("result");
if(!code){
b.innerHTML="<div class=card>Please enter your PL code</div>";
return;
}
let f=orders.find(o=>(o.id||o.orderId||"").toUpperCase()===code);
if(!f){
b.innerHTML=`<div class=card>❌ Parcel <b>${code}</b> not found.</div>`;
return;
}
let o=normalize(f);
let clean=o.driverPhone?o.driverPhone.replace(/[^0-9]/g,''):'';
if(clean.startsWith("0")) clean="27"+clean.substring(1);

// Status styling
