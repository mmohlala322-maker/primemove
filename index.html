<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIME MOVE - TRACK YOUR PARCEL</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:#fff;border-radius:16px;padding:20px;max-width:480px;margin:20px auto;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
.logo{font-size:24px;font-weight:bold;margin:0}
.logo span{color:#FFD700;background:#111;padding:2px 8px;border-radius:6px}
.input{width:100%;padding:14px;margin:10px 0;border:2px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}
.btn-black{background:#111;color:#FFD700}.btn-green{background:#00c853;color:#fff}
.status{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block;margin:8px 0}
.WAREHOUSE{background:#111;color:#FFD700}.DISPATCHED{background:#FF9500;color:#fff}.ON\ THE\ WAY{background:#007AFF;color:#fff}.DELIVERED{background:#00c853;color:#fff}.FAILED{background:#ff3b30;color:#fff}
.info{border:1px solid #eee;padding:12px;border-radius:10px;margin:10px 0;text-align:left;font-size:14px;background:#fafafa}
.info b{display:inline-block;width:90px}
.timeline{border-left:3px solid #FFD700;margin:15px 0 15px 10px;padding-left:15px;text-align:left}
.timeline div{margin:10px 0;position:relative}
.timeline div::before{content:"●";color:#FFD700;position:absolute;left:-22px;font-size:18px}
</style>
</head>
<body>
<div class="card">
<p class="logo">PRIME <span>MOVE</span></p>
<p style="font-size:12px;color:#666;margin:0 0 15px">TRACK YOUR PARCEL - FAST & SAFE</p>

<div id="inputBox">
<input class="input" id="trackInput" placeholder="Enter Tracking Code e.g. PL123456">
<button class="btn btn-black" onclick="trackParcel()">🔍 TRACK MY PARCEL</button>
<p style="font-size:11px;color:#888;margin-top:10px">Your tracking code was sent on WhatsApp</p>
</div>

<div id="resultBox" style="display:none">
<h2 id="cName" style="margin:5px 0"></h2>
<p id="cCode" style="font-size:11px;color:#888;margin:0"></p>
<div id="cStatus" class="status"></div>

<div class="info">
<b>Name:</b> <span id="rName"></span><br>
<b>Phone:</b> <span id="rPhone"></span><br>
<b>Address:</b> <span id="rAddr"></span><br>
</div>

<div class="info" style="background:#FFF9C4">
<b>Driver:</b> <span id="rDriver"></span><br>
<b>Driver Phone:</b> <a id="rDriverPhone" href="#"></a><br>
<b>Driver Code:</b> <span id="rDriverCode"></span><br>
</div>

<div class="timeline">
<div><b id="tStatus">WAREHOUSE</b><br><small id="tDate"></small></div>
<div><b>Order Received</b><br><small>Parcel registered at warehouse</small></div>
</div>

<button class="btn btn-green" onclick="shareWhatsApp()">💬 Share on WhatsApp</button>
<button class="btn btn-black" onclick="showInput()">🔍 Track Another Parcel</button>
</div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
function fillFromURL(){
  const track=params.get("track");
  if(!track) return false;
  document.getElementById("inputBox").style.display="none";
  document.getElementById("resultBox").style.display="block";
  const n=params.get("n")||"Customer";
  const cp=params.get("cp")||"";
  const a=params.get("a")||"";
  const s=params.get("s")||"WAREHOUSE";
  const dn=params.get("dn")||"";
  const dp=params.get("dp")||"";
  const dc=params.get("dc")||"";
  
  document.getElementById("cName").innerText=n;
  document.getElementById("cCode").innerText="Tracking: "+track;
  document.getElementById("cStatus").innerText=s;
  document.getElementById("cStatus").className="status "+s;
  document.getElementById("tStatus").innerText=s;
  document.getElementById("tDate").innerText=new Date().toLocaleString();
  
  document.getElementById("rName").innerText=n;
  document.getElementById("rPhone").innerText=cp;
  document.getElementById("rAddr").innerText=a;
  document.getElementById("rDriver").innerText=dn;
  document.getElementById("rDriverPhone").innerText=dp;
  document.getElementById("rDriverPhone").href="tel:"+dp;
  document.getElementById("rDriverCode").innerText=dc;
  return true;
}

function trackParcel(){
  const code=document.getElementById("trackInput").value.trim().toUpperCase();
  if(!code){alert("Enter tracking code");return}
  // try find in localStorage
  const orders=JSON.parse(localStorage.getItem("pm_final")||"[]");
  const found=orders.find(o=>o.code.toUpperCase()===code);
  if(found){
    const url=`?track=${found.code}&n=${encodeURIComponent(found.n)}&cp=${encodeURIComponent(found.cp)}&a=${encodeURIComponent(found.a)}&s=${encodeURIComponent(found.s)}&dn=${encodeURIComponent(found.dn)}&dp=${encodeURIComponent(found.dp)}&dc=${encodeURIComponent(found.dc)}`;
    window.location.href=url;
  }else{
    alert("Parcel not found on this device. Open the link sent on WhatsApp. Code: "+code);
  }
}

function shareWhatsApp(){
  const text=`My parcel ${params.get("track")} - ${params.get("s")} - Track: ${window.location.href}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
}

function showInput(){
  document.getElementById("inputBox").style.display="block";
  document.getElementById("resultBox").style.display="none";
  window.history.replaceState({},'',window.location.pathname);
}

if(!fillFromURL()){
  document.getElementById("inputBox").style.display="block";
}
</script>
</body>
</html>
