<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeMove Track</title>
<style>
body{font-family:Arial;background:#f8fafc;margin:0;padding-bottom:20px}
.h{background:#111;color:#fff;padding:20px;text-align:center}
.s{background:#fff;margin:-15px 12px 12px;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}

input{border:2px solid #e2e8f0}
button{border:none;font-weight:bold;cursor:pointer}
.black{background:#111;color:#fff}
.card{background:#fff;margin:12px;padding:20px;border-radius:14px;box-shadow:0 2px 8px #0001}
.statusBox{margin:14px 0;padding:16px;border-radius:12px;text-align:center;font-weight:bold;font-size:16px;border:2px solid}
</style>
</head>
<body>
<div class=h><h1 style=margin:0>PrimeMove 🚚</h1><div style=font-size:13px;opacity:0.8;margin-top:4px>Track Your Parcel</div></div>
<div class=s>
<input id=trackInput placeholder="Enter PL code e.g. PL262857">
<button onclick=doTrack() class=black>🔍 TRACE MY PARCEL</button>
</div>
<div id=result><div class=card style=text-align:center;color:#64748b>Enter your PL code above and press TRACE</div></div>

<script>
// DEFAULT PARCELS - ALWAYS THERE EVEN IF PHONE EMPTY!
let defaultOrders = [
  {id:"PL262857",customerName:"Customer",deliveryAddress:"Durban, KZN",driverCode:"PM-DRV-01",driverName:"PrimeMove Driver",driverPhone:"0810000000",status:"In Warehouse",amount:"0",deliveryFee:"0",createdAt:"2026-11-01"},
  {id:"PL262858",customerName:"Test Customer",deliveryAddress:"Durban",driverCode:"PM-DRV-01",driverName:"PrimeMove Driver",driverPhone:"0810000000",status:"Out for Delivery",amount:"0",deliveryFee:"0",createdAt:"2026-11-01"}
];

let orders = [];
try{
  let saved = localStorage.getItem("pm_final");
  if(saved) orders = JSON.parse(saved);
}catch(e){}
if(orders.length==0) orders = defaultOrders;

// SYNC - If admin sends new data, merge it
try{
  let u = new URL(location.href);
  let s = u.searchParams.get("sync");
  let t = u.searchParams.get("track");
  if(s){
    try{
      let j = decodeURIComponent(atob(s));
      try{j=decodeURIComponent(j);}catch(e){}
      let inc = JSON.parse(j);
      if(!Array.isArray(inc)) inc=[inc];
      inc.forEach(ni=>{
        let id = ni.id||ni.orderId;
        let idx = orders.findIndex(o=>(o.id||o.orderId)==id);
        if(idx>=0) orders[idx]={...orders[idx],...ni};
        else orders.unshift(ni);
      });
      localStorage.setItem("pm_final",JSON.stringify(orders));
    }catch(e){console.log("sync fail",e)}
  }
  if(t){
    document.getElementById("trackInput").value=t;
    setTimeout(()=>doTrackCode(t),500);
  }
}catch(e){}
