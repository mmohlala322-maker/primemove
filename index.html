<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track</title><style>body{font-family:Arial;background:#f8fafc;margin:0} .h{background:#111;color:#fff;padding:18px;text-align:center} .s{background:#fff;margin:-15px 12px 12px;padding:14px;border-radius:14px} input,button{width:100%;padding:13px;border-radius:10px;margin-top:8px;box-sizing:border-box} input{border:2px solid #e2e8f0} button{border:none;font-weight:bold} .black{background:#111;color:#fff} .card{background:#fff;margin:12px;padding:16px;border-radius:14px}</style></head><body><div class=h><h1>PrimeMove</h1><div style=font-size:12px>Enter your PL code to track</div></div><div class=s><input id=trackInput placeholder="PL code e.g. PL262857"><button onclick=doTrack() class=black>TRACK MY PARCEL</button><div id=debug style=font-size:10px;color:#fff;margin-top:4px></div></div><div id=result></div><script>let orders=[];try{let r=localStorage.getItem("pm_final");if(r)orders=JSON.parse(r);}catch(e){}(function(){try{let u=new URL(location.href);let s=u.searchParams.get("sync");let t=u.searchParams.get("track");if(s){let j=decodeURIComponent(atob(s));j=decodeURIComponent(j);let inc=JSON.parse(j);if(!Array.isArray(inc))inc=[inc];let ids=orders.map(o=>o.id);inc.forEach(ni=>{let id=ni.id||ni.orderId;if(id&&!ids.includes(id)){orders.unshift(ni);ids.push(id);}});localStorage.setItem("pm_final",JSON.stringify(orders));if(t){document.getElementById("trackInput").value=t;setTimeout(()=>doTrackCode(t),600);return;}}if(t){document.getElementById("trackInput").value=t;setTimeout(()=>doTrackCode(t),400);}}catch(e){}})();function normalize(o){return{id:o.id||o.orderId,customerName:o.customerName||"",customerPhone:o.customerPhone||"",deliveryAddress:o.deliveryAddress||"",amount:o.amount||"0",deliveryFee:o.deliveryFee||"0",driverCode:o.driverCode||"",driverName:o.driverName||o.driverCode,driverPhone:o.driverPhone||"",status:o.status||"Assigned",createdAt:o.createdAt||new Date().toISOString()};}function doTrack(){let c=document.getElementById("trackInput").value.trim().toUpperCase();doTrackCode(c);}function doTrackCode(code){let b=document.getElementById("result");if(!code){b.innerHTML="<div class=card>Please enter your PL code</div>";return;}let f=orders.find(o=>(o.id||o.orderId||"").toUpperCase()===code);if(!f){b.innerHTML=`<div class=card>❌ Parcel <b>${code}</b> not found. Please check your code.</div>`;return;}let o=normalize(f);let clean=o.driverPhone?o.driverPhone.replace(/[^0-9]/g,''):'';if(clean.startsWith("0"))clean="27"+clean.substring(1);b.innerHTML=`<div class=card><div style=display:flex;justify-content:space-between><div><div style=font-size:11px;color:#94a3b8>PARCEL ID</div><div style=font-size:22px;font-weight:bold>${o.id}</div></div><span style=background:#fef3c7;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold>${o.status}</span></div><hr><div><b>${o.customerName}</b><br>📍 ${o.deliveryAddress}</div><div style=margin-top:12px;background:#f8fafc;padding:12px;border-radius:10px><b>Driver: ${o.driverName}</b><br>${o.driverPhone? "📞 "+o.driverPhone:""}<br>Code: ${o.driverCode}</div>${o.driverPhone?`<div style=display:flex;gap:8px;margin-top:12px><a href="tel:${o.driverPhone}" style=flex:1;background:#111;color:#fff;padding:12px;border-radius:8px;text-align:center;text-decoration:none>📞 CALL DRIVER</a><a href="https://wa.me/${clean}" target="_blank" style=flex:1;background:#25D366;color:#fff;padding:12px;border-radius:8px;text-align:center;text-decoration:none>WhatsApp Driver</a></div>`:""}</div>`;} </script></body></html>
