<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeMove - Track</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f8fafc;margin:0;padding:0}
.header{background:#111;color:white;padding:20px;text-align:center}
.header h1{margin:0;font-size:22px;letter-spacing:0.5px}
.search{background:white;margin:-20px 15px 15px 15px;padding:16px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:12px;box-sizing:border-box;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:15px;margin-top:10px;cursor:pointer}
.btn-black{background:#111;color:white}
.btn-grey{background:#f1f5f9;color:#475569}
.card{background:white;margin:12px 15px;padding:18px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.badge{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:bold;letter-spacing:0.5px}
.badge-assigned{background:#fef3c7;color:#92400e}
.badge-picked{background:#dbeafe;color:#1e40af}
.badge-delivered{background:#dcfce7;color:#166534}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.8px;font-weight:600}
.value{font-size:15px;font-weight:600;color:#0f172a;margin-top:4px}
.driverBox{background:#f8fafc;border:1px solid #e2e8f0;padding:14px;border-radius:14px;display:flex;align-items:center;gap:12px;margin-top:12px}
.avatar{width:48px;height:48px;background:#FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#111;font-size:18px}
.timeline{margin-top:18px;border-left:2px dashed #e2e8f0;padding-left:22px}
.step{position:relative;margin-bottom:20px}
.step::before{content:"";position:absolute;left:-29px;top:3px;width:14px;height:14px;border-radius:50%;background:#e2e8f0;border:2px solid white}
.step.done::before{background:#22c55e}
.step.active::before{background:#111}
.callBtn{padding:12px;border-radius:10px;text-decoration:none;display:inline-block;text-align:center;flex:1;font-weight:bold;font-size:13px}
</style>
</head>
<body>
<div class="header"><h1>🚚 PrimeMove</h1><div style="font-size:12px;opacity:0.7;margin-top:4px">Premium Delivery • Track Your Parcel</div></div>

<div class="search">
<input id="trackInput" placeholder="Enter PL code (e.g. PL262857)">
<button onclick="track()" class="btn btn-black">TRACK PARCEL</button>
<button onclick="loadAll()" class="btn btn-grey">Show All
