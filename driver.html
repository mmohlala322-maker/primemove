<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeMove Driver</title>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:10px}
.card{background:#fff;color:#111;border-radius:12px;padding:15px;margin:10px 0}
.btn{padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-gold{background:#FFD700;color:#111}
.btn-black{background:#111;color:#FFD700}
.status{padding:4px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.s-WAREHOUSE{background:#fff3cd}.s-OUT_FOR_DELIVERY{background:#cce5ff}.s-DELIVERED{background:#d4edda}
</style>
</head>
<body>
<h2 style="color:#FFD700">🚚 PrimeMove Driver</h2>
<p>Driver: <b id="drv">PM1001</b> | Parcels: <b id="count">0</b></p>
<div id="list"></div>

<script>
// SYNC FIX - THIS MAKES DRIVER SEE YOUR ORDERS
function getOrders(){
  const params=new URLSearchParams(window.location.search);
  const sync=params.get("sync");
  if(sync){
    try{
      const json=decodeURIComponent(atob(sync));
      const data=JSON.parse(json);
      localStorage.setItem("pm_final",JSON.stringify(data));
      alert("✅ Synced "+data.length+" parcels! Now saved on your phone.");
      history.replaceState({},'',location.pathname+"?driver="+(params.get("driver")||"PM1001"));
    }catch(e){ alert("Sync failed - ask admin to resend link"); }
  }
  return JSON.parse(localStorage.getItem("pm_final")||"[]");
}

function render(){
  const params=new URLSearchParams(window.location.search);
  const driverCode=params.get("driver")||"PM1001";
  document.getElementById("drv").innerText=driverCode;
  let orders=getOrders();
  let myOrders=orders.filter(o=>o.dc===driverCode);
  document.getElementById("count").innerText=myOrders.length;
  const list=document.getElementById("list");
  if(myOrders.length===0){
    list.innerHTML="<div class='card'>No parcels yet.<br><br>Ask admin to send you SYNC LINK.<br>Open this link: primemove/sync.html on admin phone</div>";
    return;
  }
  list.innerHTML=myOrders.map(o=>`
    <div class="card">
      <b>${o.id}</b> <span class="status s-${o.s}">${o.s}</span><br>
      Customer: ${o.n}<br>
      Address: ${o.a}<br>
      Phone: ${o.cp}<br>
      <button class="btn btn-gold" onclick="updateStatus('${o.id}','OUT_FOR_DELIVERY')">Out for Delivery</button>
      <button class="btn btn-black" onclick="updateStatus('${o.id}','DELIVERED')">Delivered</button>
    </div>
  `).join("");
}

function updateStatus(id,newStatus){
  let orders=JSON.parse(localStorage.getItem("pm_final")||"[]");
  orders=orders.map(o=> o.id===id ? {...o,s:newStatus} : o);
  localStorage.setItem("pm_final",JSON.stringify(orders));
  render();
}

render();
</script>
</body>
</html>
