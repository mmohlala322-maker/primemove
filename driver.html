<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIME MOVE DRIVER</title>
<style>
body{font-family:Arial;background:#111;margin:0;padding:10px;color:#fff}
.card{background:#fff;color:#111;border-radius:12px;padding:15px;max-width:500px;margin:auto}
select,input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
.btn-black{background:#111;color:#FFD700}.btn-green{background:#00c853;color:#fff}.btn-blue{background:#007AFF;color:#fff}
.order{border:1px solid #eee;padding:10px;border-radius:8px;margin:8px 0;font-size:12px;background:#f9f9f9;color:#111}
.status{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:bold;display:inline-block}
.WAREHOUSE{background:#111;color:#FFD700}.DISPATCHED{background:#FF9500;color:#fff}.ON\ THE\ WAY{background:#007AFF;color:#fff}.DELIVERED{background:#00c853;color:#fff}.FAILED{background:#ff3b30;color:#fff}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0;text-align:center">🚚 PRIME MOVE DRIVER</h2>
<p style="text-align:center;font-size:11px;color:#666" id="driverInfo">SELECT YOUR NAME</p>

<select id="driverSelect" onchange="loadDriver()"></select>
<input id="driverCodeInput" placeholder="Or enter driver code e.g. PM1001" oninput="filterByCode()">
<button class="btn btn-black" onclick="loadOrders()">🔄 REFRESH MY PARCELS</button>

<div id="orders"></div>
</div>

<script>
const BASE="https://mmohlala322-maker.github.io/primemove/";
function getDrivers(){return JSON.parse(localStorage.getItem("pm_drivers")||'[{"name":"Sphumelele Motaung","phone":"+27828618192","code":"PM1001"}]')}
function getOrders(){return JSON.parse(localStorage.getItem("pm_final")||"[]")}

function renderDriverSelect(){
  const drivers=getDrivers();
  const sel=document.getElementById("driverSelect");
  sel.innerHTML='<option value="">-- Select Your Name --</option>';
  drivers.forEach((d,i)=>{
    sel.innerHTML+=`<option value="${d.code}">${d.name} (${d.code})</option>`;
  });
  // auto select from URL ?driver=PM1001
  const p=new URLSearchParams(window.location.search);
  const dc=p.get("driver");
  if(dc){ document.getElementById("driverCodeInput").value=dc; sel.value=dc; }
}

function loadDriver(){
  const code=document.getElementById("driverSelect").value;
  document.getElementById("driverCodeInput").value=code;
  loadOrders();
}

function filterByCode(){ loadOrders(); }

function loadOrders(){
  const code=(document.getElementById("driverCodeInput").value||document.getElementById("driverSelect").value||"").trim().toUpperCase();
  const drivers=getDrivers();
  const me=drivers.find(d=>d.code.toUpperCase()===code);
  document.getElementById("driverInfo").innerText= me ? `👋 Hi ${me.name} - Code: ${me.code}` : "Enter your driver code";
  
  const all=getOrders();
  const mine= code ? all.filter(o=>o.dc.toUpperCase()===code) : all;
  
  const div=document.getElementById("orders");
  div.innerHTML=`<h3 style="font-size:13px">📦 My Parcels: ${mine.length}</h3>`;
  if(mine.length===0){ div.innerHTML+="<p style='font-size:12px;color:#666'>No parcels assigned yet. Ask admin to assign to your code.</p>"; return; }
  
  mine.forEach(o=>{
    div.innerHTML+=`
    <div class="order">
      <b>${o.code}</b> <span class="status ${o.s}">${o.s}</span><br>
      <b>Customer:</b> ${o.n}<br>
      <b>Phone:</b> <a href="tel:${o.cp}">${o.cp}</a><br>
      <b>Address:</b> ${o.a}<br>
      <small>${o.date}</small><br>
      <button class="btn btn-blue" style="padding:8px;margin-top:6px" onclick="openTrack('${o.code}','${encodeURIComponent(o.n)}','${encodeURIComponent(o.cp)}','${encodeURIComponent(o.a)}','${encodeURIComponent(o.s)}','${encodeURIComponent(o.dn)}','${encodeURIComponent(o.dp)}','${encodeURIComponent(o.dc)}')">🔗 Tracking Link</button>
      <button class="btn btn-green" style="padding:8px" onclick="window.open('https://wa.me/${o.cp.replace(/[^0-9]/g,'')}?text=Hi ${encodeURIComponent(o.n)}, your parcel ${o.code} is ${encodeURIComponent(o.s)}','_blank')">💬 WhatsApp Customer</button>
    </div>`;
  });
}

function openTrack(code,n,cp,a,s,dn,dp,dc){
  window.open(`${BASE}?track=${code}&n=${n}&cp=${cp}&a=${a}&s=${s}&dn=${dn}&dp=${dp}&dc=${dc}`,"_blank");
}

renderDriverSelect();
loadOrders();
</script>
</body>
</html>
